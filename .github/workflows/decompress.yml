name: Decompress Playlists

on:
  schedule:
  #  - cron: '0 */9 * * *' # Every 9 hours
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'generated/*.m3u.gz'

permissions:
  contents: write

jobs:
  decompress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Decompress and strip all playlists
        run: |
          for file in generated/*.m3u.gz; do
            [ -f "$file" ] || continue
            gunzip -f "$file"
            base="${file%.gz}"

            sed -i \
            -e 's/ tvg-id="[^"]*"//g' \
            -e 's/ tvg-name="[^"]*"//g' \
            -e 's/ tvg-logo="[^"]*"//g' \
            -e 's/ group-title="[^"]*"//g' \
            "$base"

            echo "Decompressed $base"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/*.m3u
          git diff --staged --quiet || git commit -m "Auto-decompress IPTV playlists"
          git push
